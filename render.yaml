services:
  - type: web
    name: phantom-x
    env: node
    region: oregon
    plan: free
    buildCommand: python3 -m pip install --quiet --upgrade yt-dlp imageio-ffmpeg bgutil-ytdlp-pot-provider && npm install
    startCommand: npm start
    autoDeploy: true

    # ── Disk ──────────────────────────────────────────────────────────────
    # Render free tier has EPHEMERAL disk — sessions vanish on every redeploy/restart.
    # The Telegram channel backup (TELEGRAM_TOKEN + TELEGRAM_BACKUP_CHANNEL below)
    # automatically restores sessions on every cold start, so you don't lose users.
    # If you upgrade to a paid Render plan you can uncomment the disk block below
    # and sessions will survive restarts natively (Telegram backup still works too).
    #
    # disk:
    #   name: phantom-x-data
    #   mountPath: /opt/render/project/src
    #   sizeGB: 1

    envVars:
      # ── Node version ──
      - key: NODE_VERSION
        value: "20.20.2"
      - key: NODE_ENV
        value: production

      # ── Port (Render exposes 10000 externally) ──
      - key: PORT
        value: "10000"

      # ── REQUIRED: Telegram bot for backup/restore of WhatsApp sessions ──
      # Without these, sessions are lost on every restart (free-tier ephemeral disk).
      # 1. Create a bot via @BotFather → copy the token.
      # 2. Create a PRIVATE Telegram channel → add the bot as admin.
      # 3. Get the channel ID (forward a message to @userinfobot or check the URL).
      - key: TELEGRAM_TOKEN
        sync: false        # set via Render dashboard Secrets tab
      - key: TELEGRAM_BACKUP_CHANNEL
        sync: false        # set via Render dashboard Secrets tab

      # ── REQUIRED: Web dashboard admin credentials ──
      # These are the login credentials for the /login.html web UI.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ── OPTIONAL: Multi-instance user cap ──
      # Set to 15 for a standard instance (15 WhatsApp sessions per bot).
      # 0 or unset = unlimited.
      - key: MAX_USERS
        value: "15"

      # ── OPTIONAL: CORS origins ──
      # Comma-separated list of origins allowed to call the API.
      # Example: https://your-vercel-site.vercel.app,https://another-site.com
      # Leave blank to allow all origins (convenient but less secure).
      - key: ALLOWED_ORIGINS
        value: ""

      # ── OPTIONAL: Google Maps Geocoding for .weather ──
      # Falls back to free Nominatim (OSM) if unset.
      # - key: GOOGLE_MAPS_API_KEY
      #   sync: false

      # ── OPTIONAL: NewsAPI for richer .news results ──
      # Falls back to free Google News RSS if unset.
      # Free tier: https://newsapi.org/ (100 req/day)
      # - key: NEWS_API_KEY
      #   sync: false
