services:
  - type: web
    name: phantom-x
    env: node
    region: oregon
    plan: starter
    buildCommand: python3 -m pip install --quiet --upgrade yt-dlp imageio-ffmpeg bgutil-ytdlp-pot-provider && npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.20.2
      - key: PORT
        value: 10000
      # === REQUIRED ===
      # - key: TELEGRAM_TOKEN
      #   value: your_telegram_bot_token_here
      # - key: TELEGRAM_BACKUP_CHANNEL_ID
      #   value: -1001234567890

      # === OPTIONAL — Google Maps Geocoding for .weather ===
      # If set, .weather uses Google Maps first (best for street names).
      # If unset, .weather falls back to Nominatim (OSM, free, no key).
      # - key: GOOGLE_MAPS_API_KEY
      #   value: your_google_maps_api_key_here

      # === OPTIONAL — NewsAPI for richer .news results ===
      # If set, .news uses NewsAPI (cleaner JSON, structured data).
      # If unset, .news uses Google News RSS (free, no key).
      # Free tier: https://newsapi.org/ — 100 requests/day.
      # - key: NEWS_API_KEY
      #   value: your_newsapi_key_here

      # === TEST HACK (exactly what you asked for) ===
      # Set this to "12345678" and the bot will ALWAYS tell the Telegram user
      # to enter 12345678 (while still calling real requestPairingCode in background
      # so WhatsApp is in the correct "waiting for code" state).
      # This is the trick you used before when real codes were failing to link.
      # - key: FORCE_PAIRING_CODE
      #   value: "12345678"
