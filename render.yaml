services:
  - type: web
    name: phantom-x
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Add TELEGRAM_TOKEN in Render dashboard (do not commit here)
    # For persistence: Add a Disk on paid plan, mount at /opt/render/project/src/auth_info
    # Update AUTH_DIR in index.js if needed.
